<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pupitre">
<title>Pupitre</title>
<style>
:root{--bar:#1a1c1f;--inp:#101113;--rd:#0b0b0c;--box:#1c1e22;--act:#33373e;--on:#27456b;--dng:#ff8a8a;--bg:#141517;--card:#22252a;--line:#343840;--tx:#f1f1f1;--mut:#9aa0a8;--ac:#4aa3ff;--ok:#3ecf6e;--ko:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:18px -apple-system,system-ui,sans-serif;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{min-height:52px;min-width:52px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer}
button:active{background:var(--act)}
button.p{background:var(--ac);border-color:var(--ac);color:#04121f;font-weight:600}
button.d{color:var(--dng)}
button.on{background:var(--on);border-color:var(--ac)}
input[type=text]{width:100%;min-height:48px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--inp);-webkit-user-select:text;user-select:text}
input[type=range]{width:100%;height:36px}
.hide{display:none!important}
#home{height:100%;overflow:auto;padding:max(20px,env(safe-area-inset-top)) 24px 40px;-webkit-overflow-scrolling:touch}
#home header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{margin:0;font-size:30px}
.song{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.song .i{flex:1;min-width:0;padding:6px 0;cursor:pointer}
.song b{display:block;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song small{color:var(--mut)}
.empty{color:var(--mut);text-align:center;margin-top:80px;line-height:1.6}
#reader{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--rd)}
#bar{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--bar);border-bottom:1px solid var(--line)}
#bar .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;padding:0 6px}
#ind{min-width:110px;text-align:center;font-variant-numeric:tabular-nums}
#dot{width:14px;height:14px;border-radius:50%;background:var(--ko);flex:none}
#dot.ok{background:var(--ok)}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none}
#zoom{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;will-change:transform}
#zoom canvas{background:#fff;display:block}
#flash{position:absolute;inset:0;pointer-events:none;border:0 solid var(--ok);opacity:0;transition:opacity .5s}
#flash.s{opacity:1;border-width:10px;transition:none}
#audio{background:var(--bar);border-top:1px solid var(--line);padding:8px 12px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
#tr1{display:flex;align-items:center;gap:10px}
#seek{flex:1}
#mix{max-height:34vh;overflow:auto;margin-top:6px}
.trk{display:flex;align-items:center;gap:10px;padding:4px 0}
.trk span{width:20%;min-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk button{min-width:52px;padding:0}
.trk button.on.m{background:#6b2a2a;border-color:var(--ko)}
.trk button.on.so{background:#6b5a1b;border-color:#e6b422}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.box{background:var(--box);border:1px solid var(--line);border-radius:20px;padding:22px;width:min(640px,100%);max-height:92vh;overflow:auto}
.box h2{margin:0 0 14px}
.row{display:flex;gap:10px;align-items:center;margin:10px 0}
.row label{flex:1}
.row select{min-height:48px;border-radius:12px;background:var(--inp);border:1px solid var(--line);padding:0 10px;max-width:60%}
.g{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:15px}
.g span{width:130px}
.bar{flex:1;height:22px;background:var(--inp);border-radius:11px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ac);width:0}
.bar u{position:absolute;top:0;bottom:0;width:3px;background:#ff5d5d}
#pv{width:150px;border-radius:12px;transform:scaleX(-1);background:#000;float:right;margin-left:12px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:12px 20px;border-radius:30px;z-index:50;max-width:88vw;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
#toast.s{opacity:1}
.fold{border-color:#3d5a80}
#prog{position:absolute;left:0;bottom:0;height:12px;width:0;opacity:0;pointer-events:none;z-index:3}
.crumb{display:flex;gap:10px;align-items:center;margin-bottom:14px}.crumb h2{flex:1;margin:0}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}
#bar2,#tools,#met{display:flex;gap:8px;align-items:center;padding:6px 12px;background:var(--bar);border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
#bar2>*,#tools>*,#met>*{flex:none}
#slNav{display:flex;gap:8px}
.pgw{position:relative;overflow:hidden;background:#fff;flex:none}
#zoom canvas.an{background:none}
#mDots{display:flex;gap:6px}#mDots i{width:16px;height:16px;border-radius:50%;background:var(--line)}#mDots i.on{background:var(--ok)}
#met select{min-height:48px;border-radius:12px;background:var(--inp);border:1px solid var(--line);padding:0 10px}
#met input[type=range]{width:130px}
textarea.nt{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--inp);padding:10px;color:var(--tx);font:inherit;-webkit-user-select:text;user-select:text}
html[data-theme=light]{--bg:#f2f3f5;--card:#fff;--line:#d3d6dc;--tx:#16181c;--mut:#5d6570;--ac:#1a73e8;--bar:#e8eaee;--inp:#fff;--rd:#c9ccd2;--box:#fff;--act:#e3e5ea;--on:#cfe2ff;--dng:#c62828}
</style>
</head>
<body>
<div id="home">
  <header><h1>🎼 Pupitre</h1><div style="display:flex;gap:10px"><button id="thm"></button><button id="addF">+ Dossier</button><button id="addS" class="hide">+ Setlist</button><button class="p" id="add">+ Ajouter un morceau</button></div></header>
  <div class="tabs"><button id="tL">Morceaux</button><button id="tS">Setlists</button></div>
  <div id="libTools" class="row"><input type="text" id="q" placeholder="🔍 Rechercher (titre, dossier, note…)" style="flex:1"><select id="sortS"><option value="az">Titre A→Z</option><option value="za">Titre Z→A</option><option value="new">Ajoutés récemment</option><option value="open">Ouverts récemment</option></select></div>
  <div id="list"></div>
  <input type="file" id="pdfIn" accept="application/pdf,.pdf" class="hide">
  <input type="file" id="mp3In" accept="audio/*,.mp3" multiple class="hide">
</div>

<div id="reader" class="hide">
  <div id="bar">
    <button id="back">‹ Bibliothèque</button>
    <div class="t" id="rt"></div>
    <button id="prev">‹</button><div id="ind"></div><button id="next">›</button>
        <div id="dot"></div><button id="cam">Caméra</button>
    <button id="tg">Outils ▾</button>
  </div>
  <div id="bar2" class="hide">
    <button id="two">▯▯ 2 pages</button><button id="drw">✏ Annoter</button><button id="bm">🔖 Repères</button><button id="mt">♩ Métronome</button><button id="nt">📝 Notes</button><button id="set">⚙ Réglages</button>
    <span id="slNav" class="hide"><button id="slP">⏮ Morceau préc.</button><button id="slN">Morceau suiv. ⏭</button></span>
  </div>
  <div id="tools" class="hide"><button data-t="r" class="on">🔴 Rouge</button><button data-t="b">🔵 Bleu</button><button data-t="k">⚫ Noir</button><button data-t="h">🖍 Surligneur</button><button data-t="e">⌫ Gomme</button><button id="un">↶ Annuler</button><button id="clr" class="d">Effacer la page</button></div>
  <div id="met" class="hide"><button id="mM">−</button><b style="min-width:92px;text-align:center"><span id="mB">100</span> BPM</b><button id="mP">+</button><input type="range" id="mR" min="40" max="240" value="100"><select id="mS"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select><span>temps</span><button id="mT">Tap</button><span id="mDots"></span><input type="range" id="mV" min="0.1" max="1" step="0.05" value="0.6" style="width:90px"><button id="mGo" class="p">▶ Démarrer</button></div>
  <div id="stage"><div id="zoom"></div><div id="flash"></div><div id="prog"></div></div>
  <div id="audio" class="hide">
    <div id="tr1">
      <button id="rew">⏮</button><button id="pp" class="p">▶</button>
      <span id="tcur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="tdur">0:00</span>
      <button id="mixT">Pistes</button>
    </div>
    <div id="mix" class="hide"></div>
  </div>
  <video id="vid" playsinline muted class="hide"></video>
</div>

<div class="ov hide" id="startOv"><div class="box" style="text-align:center">
  <h2 id="stT"></h2><p id="stN" style="white-space:pre-wrap;text-align:left"></p><p style="color:var(--mut)">Safari exige un appui pour activer le son et la caméra.</p>
  <div class="row" style="justify-content:center"><button class="p" id="go" style="min-height:64px;font-size:22px">Démarrer</button></div>
  <button id="goNo">Continuer sans caméra</button>
</div></div>

<div class="ov hide" id="setOv"><div class="box">
  <h2>Réglages et calibration</h2>
  <video id="pv" playsinline muted></video>
  <div class="row"><label>Geste pour tourner la page</label>
    <select id="mode">
      <option value="long">Clignement long des 2 yeux</option>
      <option value="double">Double clignement</option>
      <option value="one">Œil fermé : droit = suivant, gauche = précédent</option>
      <option value="tongue">Tirer la langue</option>
      <option value="jaw">Ouvrir la bouche</option>
    </select></div>
  <div class="row"><label>Sensibilité (seuil) : <b id="vT"></b></label></div><input type="range" id="thr" min="0.2" max="0.9" step="0.05">
  <div class="row"><label>Durée de fermeture de l’œil : <b id="vH"></b> s</label></div><input type="range" id="hold" min="300" max="4000" step="100">
  <div class="row"><label>Repos après un tour : <b id="vC"></b> ms</label></div><input type="range" id="cool" min="500" max="3000" step="100">
  <div class="row"><label>Inverser gauche / droite (yeux)</label><button id="swap"></button></div>
  <div class="row"><label>Deux pages en paysage</label><button id="two2"></button></div>
  <h3>Affichage de la partition</h3>
  <div class="row"><label>Luminosité : <b id="vB"></b> %</label></div><input type="range" id="br" min="0.5" max="1" step="0.05">
  <div class="row"><label>Rogner les marges : <b id="vR"></b> %</label></div><input type="range" id="crop" min="0" max="20" step="1">
  <h3>Calibration en direct</h3>
  <div id="gauges"></div>
  <p id="camStatus" style="color:var(--mut);font-size:15px"></p>
  <p style="color:var(--mut);font-size:14px">Réglez le seuil au-dessus de vos clignements naturels. Pendant ce réglage, les gestes ne tournent pas les pages.</p>
  <div class="row"><button class="p" id="setOk" style="flex:1">Terminé</button></div>
</div></div>

<div id="mng" class="ov hide"><div class="box" id="mngBox"></div></div>
<div id="askOv" class="ov hide" style="z-index:40"><div class="box"><h2 id="aT"></h2><input type="text" id="aI"><div class="row"><button id="aN" style="flex:1">Annuler</button><button class="p" id="aY" style="flex:1">OK</button></div></div></div>
<div id="bmOv" class="ov hide"><div class="box"><h2>Repères</h2><div id="bmL"></div><div class="row"><button class="p" id="bmAdd" style="flex:1">+ Repère ici</button><button id="bmX" style="flex:1">Fermer</button></div></div></div>
<div id="noteV" class="ov hide"><div class="box"><h2>Notes</h2><div id="noteT" style="white-space:pre-wrap;-webkit-user-select:text;user-select:text"></div><div class="row"><button id="noteM">Régler le métronome</button><button class="p" id="noteX">Fermer</button></div></div></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const MP='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',
MODEL='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}catch(e){}
document.addEventListener('gesturestart',e=>e.preventDefault());
let tt;function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.classList.add('s');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('s'),ms)}

function ask(title,def,confirmOnly){return new Promise(res=>{const o=$('#askOv'),i=$('#aI');$('#aT').textContent=title;i.classList.toggle('hide',!!confirmOnly);i.value=def||'';o.classList.remove('hide');if(!confirmOnly)setTimeout(()=>i.focus(),60);
const done=v=>{o.classList.add('hide');res(v)};
$('#aY').onclick=()=>done(confirmOnly?true:i.value.trim());$('#aN').onclick=()=>done(null);i.onkeydown=e=>{if(e.key==='Enter')$('#aY').onclick()}})}
/* ---------- Réglages ---------- */
const DEF={mode:'one',thr:.55,hold:2000,cool:1000,swap:false,two:false,cam:true,sort:'az',theme:'dark',br:1,crop:0};
let S={...DEF};try{const st=JSON.parse(localStorage.getItem('pupS')||'{}');S={...DEF,...st};if(st.v!==2){S.mode='one';S.hold=2000;S.v=2}}catch(e){}
const saveS=()=>{try{localStorage.setItem('pupS',JSON.stringify(S))}catch(e){}};

/* ---------- IndexedDB ---------- */
let db;const mem=new Map();
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('pupitre',1);r.onupgradeneeded=()=>r.result.createObjectStore('songs',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const tx=(m,f)=>new Promise((res,rej)=>{if(!db){return res(f===null?0:undefined)}const t=db.transaction('songs',m);const q=f(t.objectStore('songs'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)});
const getAll=()=>db?tx('readonly',s=>s.getAll()):Promise.resolve([...mem.values()]);
const put=x=>db?tx('readwrite',s=>s.put(x)):(mem.set(x.id,x),Promise.resolve());
const del=id=>db?tx('readwrite',s=>s.delete(id)):(mem.delete(id),Promise.resolve());

/* ---------- Bibliothèque ---------- */
let songs=[];
let curF='';
const getF=()=>{let a=[];try{a=JSON.parse(localStorage.getItem('pupF')||'[]')}catch(e){}return [...new Set([...a,...songs.map(s=>s.folder).filter(Boolean)])].sort((a,b)=>a.localeCompare(b,'fr'))};
const setF=a=>{try{localStorage.setItem('pupF',JSON.stringify(a))}catch(e){}};
let view='lib',curSL=null,slCtx=null,SLs=[];try{SLs=JSON.parse(localStorage.getItem('pupSL')||'[]')}catch(e){}
const saveSL=()=>{try{localStorage.setItem('pupSL',JSON.stringify(SLs))}catch(e){}};
const LO=()=>{try{return JSON.parse(localStorage.getItem('pupLO')||'{}')}catch(e){return {}}};
function sortList(a){const lo=LO(),ti=(x,y)=>x.title.localeCompare(y.title,'fr');
  return a.sort(S.sort==='za'?(x,y)=>ti(y,x):S.sort==='new'?(x,y)=>+y.id-+x.id:S.sort==='open'?(x,y)=>(lo[y.id]||0)-(lo[x.id]||0):ti)}
async function refresh(){
  try{songs=(await getAll()||[])}catch(e){toast('Erreur de lecture de la bibliothèque')}
  renderHome()}
function renderHome(){
  const isL=view==='lib';
  $('#tL').classList.toggle('on',isL);$('#tS').classList.toggle('on',!isL);
  $('#libTools').classList.toggle('hide',!isL);$('#add').classList.toggle('hide',!isL);
  $('#addS').classList.toggle('hide',isL||!!curSL);
  $('#list').innerHTML='';
  if(isL)renderLib();else{$('#addF').classList.add('hide');renderSL()}}
function renderLib(){
  const q=$('#q').value.trim().toLowerCase(),L=$('#list');
  if(curF&&!getF().includes(curF))curF='';
  const inF=!q&&!!curF;
  $('#addF').classList.toggle('hide',inF||!!q);
  if(inF){
    const c=document.createElement('div');c.className='crumb';c.innerHTML='<button>‹ Tous</button><h2></h2><button>Renommer</button><button class="d">Supprimer</button>';
    c.querySelector('h2').textContent='📁 '+curF;const b=c.querySelectorAll('button');
    b[0].onclick=()=>{curF='';refresh()};
    b[1].onclick=async()=>{const n=await ask('Nouveau nom du dossier',curF);if(!n||n===curF)return;
      for(const s of songs)if(s.folder===curF){s.folder=n;await put(s)}
      setF(getF().filter(x=>x!==curF).concat(n));curF=n;refresh()};
    b[2].onclick=async()=>{if(!await ask('Supprimer le dossier « '+curF+' » ? Les morceaux reviennent à la racine.',null,true))return;
      for(const s of songs)if(s.folder===curF){s.folder='';await put(s)}
      setF(getF().filter(x=>x!==curF));curF='';refresh()};
    L.appendChild(c);
  }else if(!q)getF().forEach(f=>{const n=songs.filter(s=>s.folder===f).length;
    const d=document.createElement('div');d.className='song fold';
    d.innerHTML=`<div class="i"><b></b><small>${n} morceau${n>1?'x':''}</small></div><span style="font-size:28px;color:var(--mut)">›</span>`;
    d.querySelector('b').textContent='📁 '+f;d.querySelector('.i').onclick=()=>{curF=f;refresh()};L.appendChild(d)});
  const list=sortList(songs.filter(s=>q?[s.title,s.folder,s.notes&&s.notes.key,s.notes&&s.notes.text].join(' ').toLowerCase().includes(q):(s.folder||'')===(inF?curF:'')));
  if(!list.length&&(q||inF||!getF().length))L.insertAdjacentHTML('beforeend','<div class="empty">'+(q?'Aucun résultat.':inF?'Dossier vide.<br>Ajoutez un morceau ici, ou déplacez-en via « Gérer ».':'Aucun morceau pour l’instant.<br>Touchez « Ajouter un morceau » pour importer un PDF de partition.')+'</div>');
  list.forEach(s=>{
    const d=document.createElement('div');d.className='song';const n=s.tracks.length;
    d.innerHTML='<div class="i"><b></b><small></small></div><button>Gérer</button>';
    d.querySelector('b').textContent=s.title;
    d.querySelector('small').textContent=`${s.pages} page${s.pages>1?'s':''} · ${n} piste${n>1?'s':''} audio`+(q&&s.folder?' · 📁 '+s.folder:'')+(s.notes&&s.notes.key?' · '+s.notes.key:'');
    d.querySelector('.i').onclick=()=>openSong(s.id);
    d.querySelector('button').onclick=()=>manage(s.id);
    L.appendChild(d);
  });
}
function renderSL(){
  const L=$('#list');
  if(!curSL){
    if(!SLs.length)L.innerHTML='<div class="empty">Aucune setlist.<br>Touchez « + Setlist » pour en créer une.</div>';
    SLs.forEach(sl=>{const d=document.createElement('div');d.className='song';const n=sl.songs.filter(id=>songs.some(s=>s.id===id)).length;
      d.innerHTML=`<div class="i"><b></b><small>${n} morceau${n>1?'x':''}</small></div><span style="font-size:28px;color:var(--mut)">›</span>`;
      d.querySelector('b').textContent='🎵 '+sl.name;d.querySelector('.i').onclick=()=>{curSL=sl.id;refresh()};L.appendChild(d)});
    return}
  const sl=SLs.find(x=>x.id===curSL);if(!sl){curSL=null;return renderHome()}
  sl.songs=sl.songs.filter(id=>songs.some(s=>s.id===id));
  const c=document.createElement('div');c.className='crumb';c.innerHTML='<button>‹ Setlists</button><h2></h2><button>Renommer</button><button class="d">Supprimer</button>';
  c.querySelector('h2').textContent='🎵 '+sl.name;const b=c.querySelectorAll('button');
  b[0].onclick=()=>{curSL=null;refresh()};
  b[1].onclick=async()=>{const n=await ask('Nom de la setlist',sl.name);if(n){sl.name=n;saveSL();refresh()}};
  b[2].onclick=async()=>{if(await ask('Supprimer la setlist « '+sl.name+' » ? (Les morceaux sont conservés.)',null,true)){SLs=SLs.filter(x=>x!==sl);saveSL();curSL=null;refresh()}};
  L.appendChild(c);
  const bar=document.createElement('div');bar.className='row';bar.innerHTML='<button class="p" style="flex:1">▶ Jouer la setlist</button><button style="flex:1">+ Ajouter des morceaux</button>';
  bar.children[0].onclick=()=>sl.songs.length?openSong(sl.songs[0],{id:sl.id,i:0}):toast('Setlist vide');
  bar.children[1].onclick=()=>pickSongs(sl);L.appendChild(bar);
  sl.songs.forEach((id,i)=>{const s=songs.find(x=>x.id===id),d=document.createElement('div');d.className='song';

      const v1=page.getViewport({scale:1}),sc=Math.min(bw/(v1.width*k),H/(v1.height*k)),v=page.getViewport({scale:sc*dpr*1.5}),cw=v1.width*sc,ch=v1.height*sc;

/* zoom / tactile */
function applyZ(){zoom.style.transform=`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`}
let T=null;
const pts=t=>t.length>1?{x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2}:{x:t[0].clientX,y:t[0].clientY};
const dst=t=>t.length>1?Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY):0;
stage.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches;
  T={n:Math.max(T&&e.touches.length>1?T.n:0,t.length),t0:T?T.t0:Date.now(),mv:T?T.mv:0,x0:t[0].clientX,last:pts(t),d:dst(t),s:Z.s,dr:T?T.dr:null};
  if(draw){if(t.length===1)strokeStart(t[0],T);else strokeCancel(T)}},{passive:false});
stage.addEventListener('touchmove',e=>{e.preventDefault();if(!T)return;const t=e.touches,p=pts(t);
  if(T.dr&&t.length===1){strokeMove(t[0],T);return}
  T.mv+=Math.abs(p.x-T.last.x)+Math.abs(p.y-T.last.y);
  if(t.length>1&&T.d)Z.s=clamp(T.s*dst(t)/T.d,1,5);
  if(Z.s>1){Z.x+=p.x-T.last.x;Z.y+=p.y-T.last.y;const mx=(Z.s-1)*stage.clientWidth/2,my=(Z.s-1)*stage.clientHeight/2;Z.x=clamp(Z.x,-mx,mx);Z.y=clamp(Z.y,-my,my)}else{Z.x=Z.y=0}
  T.last=p;applyZ()},{passive:false});
stage.addEventListener('touchend',e=>{e.preventDefault();
  if(e.touches.length===0&&T){
    strokeEnd(T);if(!draw&&T.n===1&&T.mv<14&&Date.now()-T.t0<450){
      const r=stage.getBoundingClientRect(),x=(T.x0-r.left)/r.width;
      if(Z.s>1){Z={s:1,x:0,y:0};applyZ()}else if(x<.22)go(-1);else if(x>.78)go(1);
    }
    if(Z.s<1.05){Z={s:1,x:0,y:0};applyZ()}T=null;
  }else if(T&&e.touches.length){T.last=pts(e.touches);T.d=dst(e.touches);T.s=Z.s}},{passive:false});

/* ---------- Audio multipistes (Web Audio : volume fiable sur iOS) ---------- */
let AC,TR=[],playing=false,off=0,t0=0,dur=0,tick2;
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const pos=()=>playing?Math.max(0,off+AC.currentTime-t0):off;
async function initAudio(){
  TR=[];playing=false;off=0;dur=0;AC=null;
  $('#audio').classList.toggle('hide',!song.tracks.length);$('#mix').classList.add('hide');
  if(!song.tracks.length)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){toast('Audio indisponible');$('#audio').classList.add('hide');return}
  TR=song.tracks.map(t=>({name:t.name,blob:t.blob,buf:null,vol:1,mute:false,solo:false,g:AC.createGain(),src:null}));
  TR.forEach(t=>t.g.connect(AC.destination));
  drawMix();$('#pp').disabled=true;
  await Promise.all(TR.map(async t=>{try{t.buf=await AC.decodeAudioData(await t.blob.arrayBuffer());dur=Math.max(dur,t.buf.duration)}catch(e){toast('Piste illisible : '+t.name,4000)}}));
  $('#pp').disabled=false;$('#tdur').textContent=fmt(dur);gains();
  clearInterval(tick2);tick2=setInterval(()=>{if(!AC)return;const p=pos();
    if(playing&&p>=dur){pause();off=0;}
    $('#tcur').textContent=fmt(pos());if(!seeking)$('#seek').value=dur?pos()/dur*1000:0},150);
}
function gains(){const any=TR.some(t=>t.solo);TR.forEach(t=>t.g.gain.value=(any?t.solo:!t.mute)?t.vol:0)}
function play(){if(!AC||playing||!dur)return;AC.resume();const st=AC.currentTime+.08;
  TR.forEach(t=>{if(!t.buf)return;const s=AC.createBufferSource();s.buffer=t.buf;s.connect(t.g);try{s.start(st,Math.min(off,t.buf.duration-.01))}catch(e){}t.src=s});
  t0=st;playing=true;$('#pp').textContent='⏸'}
function pause(){if(!AC||!playing)return;off=pos();playing=false;TR.forEach(t=>{try{t.src&&t.src.stop()}catch(e){}t.src=null});$('#pp').textContent='▶'}
function seekTo(v){const was=playing;if(was)pause();off=clamp(v,0,dur);if(was)play();$('#tcur').textContent=fmt(off)}
function stopAudio(){pause();clearInterval(tick2);try{AC&&AC.close()}catch(e){}AC=null;TR=[]}
$('#pp').onclick=()=>playing?pause():play();
$('#rew').onclick=()=>seekTo(0);
let seeking=false;const sk=$('#seek');
sk.oninput=()=>{seeking=true;$('#tcur').textContent=fmt(sk.value/1000*dur)};
sk.onchange=()=>{seeking=false;seekTo(sk.value/1000*dur)};
$('#mixT').onclick=()=>{$('#mix').classList.toggle('hide');setTimeout(render,50)};
function drawMix(){const M=$('#mix');M.innerHTML='';
  TR.forEach(t=>{const r=document.createElement('div');r.className='trk';
    r.innerHTML='<span></span><input type="range" min="0" max="1" step="0.01"><button class="m">Muet</button><button class="so">Solo</button>';
    r.querySelector('span').textContent=t.name;const v=r.querySelector('input');v.value=t.vol;
    v.oninput=()=>{t.vol=+v.value;gains()};
    const m=r.querySelector('.m'),so=r.querySelector('.so');
    m.onclick=()=>{t.mute=!t.mute;m.classList.toggle('on',t.mute);gains()};
    so.onclick=()=>{t.solo=!t.solo;so.classList.toggle('on',t.solo);gains()};M.appendChild(r)})}

let lm,stream,camOn=false,timer,lastVT=-1,face=false,vals={bl:0,br:0,tg:0,jw:0},lastTurn=0,calib=false;
const g={t:0,dir:0,fired:false,need:false,ends:[],on:false,bt:0};
const vid=$('#vid'),pv=$('#pv');
function status(m){$('#camStatus').textContent=m;if(m)toast(m,4500)}
async function loadLM(){
  const m=await import(MP+'/vision_bundle.mjs'),fs=await m.FilesetResolver.forVisionTasks(MP+'/wasm');
  const mk=d=>m.FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:MODEL,delegate:d},runningMode:'VIDEO',numFaces:1,outputFaceBlendshapes:true});
  try{return await mk('GPU')}catch(e){return await mk('CPU')}
}
async function startCam(){
  if(camOn)return true;
  $('#camStatus').textContent='Chargement du modèle de détection…';
  try{if(!lm)lm=await loadLM()}catch(e){status('Modèle indisponible (connexion ?). Utilisez les boutons ou touchez les bords de l’écran.');return false}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    vid.srcObject=stream;pv.srcObject=stream;await vid.play();pv.play().catch(()=>{});
  }catch(e){stopCam();status('Caméra refusée ou indisponible. Autorisez-la dans Réglages › Safari, ou utilisez les boutons.');return false}
  camOn=true;S.cam=true;saveS();$('#camStatus').textContent='Détection active.';timer=setInterval(detect,40);updDot();updBtn();return true;
}
function stopCam(){clearInterval(timer);camOn=false;face=false;try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}stream=null;vid.srcObject=null;pv.srcObject=null;updDot();updBtn()}
function updDot(){$('#dot').classList.toggle('ok',camOn&&face)}
$('#cam').onclick=async()=>{if(camOn){stopCam();S.cam=false;saveS();toast('Détection désactivée')}else{await startCam()}};
function detect(){
  if(vid.readyState<2||vid.currentTime===lastVT)return;lastVT=vid.currentTime;
  let r;try{r=lm.detectForVideo(vid,performance.now())}catch(e){return}
  const bs=r.faceBlendshapes&&r.faceBlendshapes[0],now=performance.now();
  if(!bs){if(face){face=false;updDot()}Object.assign(g,{t:0,dir:0,fired:false,on:false});vals={bl:0,br:0,tg:0,jw:0};prog(0);drawG();return}
  const m={};bs.categories.forEach(c=>m[c.categoryName]=c.score);
  let bl=m.eyeBlinkLeft||0,br=m.eyeBlinkRight||0;if(S.swap)[bl,br]=[br,bl];
  vals={bl,br,tg:m.tongueOut||0,jw:m.jawOpen||0};
  if(!face){face=true;updDot()}
  gesture(now);drawG();
}
function gesture(now){
  const Th=S.thr,{bl,br,tg,jw}=vals;
  if(now-lastTurn<S.cool){g.t=0;g.on=false;return}
  if(S.mode==='double'){
    const both=bl>Th&&br>Th;
    if(both&&!g.on){g.on=true;g.bt=now}
    else if(!both&&g.on){g.on=false;const d=now-g.bt;
      if(d>=60&&d<=Math.max(450,S.hold)){g.ends=g.ends.filter(x=>now-x<1000);g.ends.push(now);if(g.ends.length>=2){g.ends=[];fire(1,now)}}}
    return}
  let cond=false,dir=1;
  if(S.mode==='long')cond=bl>Th&&br>Th;
  else if(S.mode==='tongue')cond=tg>Th;
  else if(S.mode==='jaw')cond=jw>Th;
  else{const lo=Th*.7;if(bl>Th&&br<lo){cond=true;dir=-1}else if(br>Th&&bl<lo){cond=true;dir=1}}
  if(g.need){if(!cond)g.need=false;prog(0);return}
  if(!cond){if(g.t&&now-g.ok<200)return;g.t=0;g.dir=0;g.fired=false;prog(0);return}
  g.ok=now;
  if(!g.t||g.dir!==dir){g.t=now;g.dir=dir;g.fired=false}
  else if(!g.fired){prog(Math.min(1,(now-g.t)/S.hold),dir);if(now-g.t>=S.hold){g.fired=true;prog(0);fire(dir,now)}}
}
function prog(v,dir){const p=$('#prog');p.style.width=Math.round(v*100)+'%';p.style.background=dir<0?'#e6b422':'#3ecf6e';p.style.opacity=v?1:0}
function fire(dir,now){
  lastTurn=now;g.need=true;g.t=0;g.fired=false;
  if(calib){flash('Geste reconnu ✓');return}
  go(dir);flash(dir>0?'Page suivante ▶':'◀ Page précédente');
}
function flash(m){const f=$('#flash');f.classList.add('s');setTimeout(()=>f.classList.remove('s'),120);toast(m,900);if(navigator.vibrate)try{navigator.vibrate(30)}catch(e){}}

$('#gauges').innerHTML=GL.map(([k,n])=>`<div class="g"><span>${n}</span><div class="bar"><i id="g_${k}"></i><u class="th"></u></div></div>`).join('');
function drawG(){if(!calib)return;GL.forEach(([k])=>$('#g_'+k).style.width=Math.round(vals[k]*100)+'%')}
function syncSet(){$('#br').value=S.br;$('#vB').textContent=Math.round(S.br*100);$('#crop').value=S.crop;$('#vR').textContent=S.crop;
  $('#mode').value=S.mode;$('#thr').value=S.thr;$('#hold').value=S.hold;$('#cool').value=S.cool;
  $('#vT').textContent=Math.round(S.thr*100)+' %';$('#vH').textContent=(S.hold/1000).toFixed(1);$('#vC').textContent=S.cool;
  document.querySelectorAll('.th').forEach(u=>u.style.left=S.thr*100+'%');updBtn()}
const HD={long:500,double:450,one:2000,tongue:250,jaw:250};
$('#mode').onchange=e=>{S.mode=e.target.value;S.hold=HD[S.mode];saveS();syncSet()};
['thr','hold','cool'].forEach(k=>$('#'+k).oninput=e=>{S[k]=+e.target.value;saveS();syncSet()});
$('#swap').onclick=()=>{S.swap=!S.swap;saveS();syncSet()};
$('#two2').onclick=()=>{S.two=!S.two;saveS();syncSet();render()};
$('#set').onclick=async()=>{calib=true;syncSet();$('#setOv').classList.remove('hide');if(!camOn)await startCam()};
$('#setOk').onclick=()=>{calib=false;$('#setOv').classList.add('hide');if(!S.cam)stopCam();render()};

/* ---------- Thème ---------- */
const mq=matchMedia('(prefers-color-scheme: light)');
function applyTheme(){document.documentElement.dataset.theme=S.theme==='auto'?(mq.matches?'light':'dark'):S.theme;$('#thm').textContent={dark:'🌙',light:'☀️',auto:'🌗'}[S.theme]}
mq.addEventListener&&mq.addEventListener('change',applyTheme);
$('#thm').onclick=()=>{S.theme={dark:'light',light:'auto',auto:'dark'}[S.theme]||'dark';saveS();applyTheme();toast('Thème : '+{dark:'sombre',light:'clair',auto:'automatique'}[S.theme])};
$('#br').oninput=e=>{S.br=+e.target.value;saveS();syncSet();zoom.style.filter=`brightness(${S.br})`};
let rcd;$('#crop').oninput=e=>{S.crop=+e.target.value;saveS();syncSet();clearTimeout(rcd);rcd=setTimeout(()=>song&&render(),200)};

/* ---------- Outils du lecteur ---------- */
const tog=(id,btn,on)=>{const h=$(id).classList.toggle('hide',on===undefined?undefined:!on);if(btn)$(btn).classList.toggle('on',!h);setTimeout(()=>song&&render(),60);return !h};
$('#tg').onclick=()=>tog('#bar2','#tg');
const slLen=()=>{const sl=SLs.find(x=>x.id===slCtx.id);return sl?sl.songs.length:0};
function slGo(d){if(!slCtx)return;const sl=SLs.find(x=>x.id===slCtx.id);if(!sl)return;const i=slCtx.i+d;
  if(i<0||i>=sl.songs.length)return toast(d>0?'Fin de la setlist':'Premier morceau');openSong(sl.songs[i],{id:sl.id,i},true)}
$('#slP').onclick=()=>slGo(-1);$('#slN').onclick=()=>slGo(1);

/* annotations */
const TOOLS={r:{c:'#e53935',w:3,a:1},b:{c:'#1e66f5',w:3,a:1},k:{c:'#111111',w:3,a:1},h:{c:'#ffd400',w:20,a:.35}};
let draw=false,curTool='r',ANN={},BM=[];
const saveAn=()=>{try{localStorage.setItem('ann_'+song.id,JSON.stringify(ANN))}catch(e){toast('Annotations non enregistrées (stockage plein)')}};
function drawAn(an){const x=an.getContext('2d'),W=an.width,H=an.height;x.clearRect(0,0,W,H);x.lineCap=x.lineJoin='round';
  for(const s of (ANN[an.dataset.pg]||[])){x.globalAlpha=s.a;x.strokeStyle=s.c;x.lineWidth=s.w*W/1000;x.beginPath();
    s.p.forEach((q,i)=>i?x.lineTo(q[0]*W,q[1]*H):x.moveTo(q[0]*W,q[1]*H));if(s.p.length===1)x.lineTo(s.p[0][0]*W+.1,s.p[0][1]*H);x.stroke()}
  x.globalAlpha=1}
function pageAt(t){for(const an of zoom.querySelectorAll('canvas.an')){const w=an.parentNode.getBoundingClientRect();
  if(t.clientX>=w.left&&t.clientX<=w.right&&t.clientY>=w.top&&t.clientY<=w.bottom)return {an,r:an.getBoundingClientRect()}}}
const ptOf=(h,t)=>[(t.clientX-h.r.left)/h.r.width,(t.clientY-h.r.top)/h.r.height];
function strokeStart(t,T){const h=pageAt(t);if(!h)return;T.dr=h;const pg=h.an.dataset.pg;
  if(curTool==='e'){eraseAt(h,ptOf(h,t));return}
  const o=TOOLS[curTool],s={c:o.c,w:o.w,a:o.a,p:[ptOf(h,t)]};h.s=s;(ANN[pg]=ANN[pg]||[]).push(s);drawAn(h.an)}
function strokeMove(t,T){const h=T.dr;if(!h)return;const q=ptOf(h,t);if(curTool==='e')eraseAt(h,q);else{h.s.p.push(q);drawAn(h.an)}}
function eraseAt(h,q){const pg=h.an.dataset.pg,a=ANN[pg]||[];
  const n=a.filter(s=>!s.p.some(p=>Math.hypot(p[0]-q[0],(p[1]-q[1])*h.r.height/h.r.width)<.025));
  if(n.length!==a.length){ANN[pg]=n;drawAn(h.an)}}
function strokeEnd(T){if(T.dr){T.dr=null;saveAn()}}
function strokeCancel(T){const h=T.dr;if(h&&h.s){const a=ANN[h.an.dataset.pg],i=a.indexOf(h.s);if(i>=0)a.splice(i,1);drawAn(h.an)}T.dr=null}
$('#drw').onclick=()=>{draw=tog('#tools','#drw');if(draw)toast('Dessinez au doigt · deux doigts pour zoomer',2500)};
document.querySelectorAll('#tools [data-t]').forEach(b=>b.onclick=()=>{curTool=b.dataset.t;document.querySelectorAll('#tools [data-t]').forEach(x=>x.classList.toggle('on',x===b))});
$('#un').onclick=()=>{for(const an of [...zoom.querySelectorAll('canvas.an')].reverse()){const a=ANN[an.dataset.pg];if(a&&a.length){a.pop();drawAn(an);saveAn();return}}};
$('#clr').onclick=async()=>{if(!await ask('Effacer toutes les annotations de cette page ?',null,true))return;
  zoom.querySelectorAll('canvas.an').forEach(an=>{ANN[an.dataset.pg]=[];drawAn(an)});saveAn()};

/* repères */
const saveBM=()=>{try{localStorage.setItem('bm_'+song.id,JSON.stringify(BM))}catch(e){}};
function drawBM(){const L=$('#bmL');L.innerHTML=BM.length?'':'<p style="color:var(--mut)">Aucun repère. Allez à la page voulue (et à l’endroit voulu dans l’audio), puis ajoutez-en un.</p>';
  BM.forEach((b,i)=>{const r=document.createElement('div');r.className='row';
    r.innerHTML='<button class="p">Aller</button><input type="text"><span style="white-space:nowrap;color:var(--mut)"></span><button class="d">✕</button>';
    const [g,inp,sp,x]=r.children;inp.value=b.name;sp.textContent='p.'+b.page+(b.time!=null?' · '+fmt(b.time):'');
    inp.onchange=()=>{b.name=inp.value.trim()||b.name;saveBM()};
    g.onclick=()=>{$('#bmOv').classList.add('hide');cur=clamp(b.page,1,N);render();if(b.time!=null&&AC&&dur)seekTo(b.time)};
    x.onclick=()=>{BM.splice(i,1);saveBM();drawBM()};L.appendChild(r)})}
$('#bm').onclick=()=>{drawBM();$('#bmOv').classList.remove('hide')};$('#bmX').onclick=()=>$('#bmOv').classList.add('hide');
$('#bmAdd').onclick=()=>{BM.push({name:'Repère '+(BM.length+1),page:cur,time:AC&&dur?pos():null});BM.sort((a,b)=>a.page-b.page||(a.time||0)-(b.time||0));saveBM();drawBM()};

/* notes */
function notesTxt(s){const n=s.notes||{},a=[];if(n.key)a.push('Tonalité : '+n.key);if(+n.bpm)a.push('Tempo : '+n.bpm+' BPM');if(n.text)a.push(n.text);return a.join('\n')}
$('#nt').onclick=()=>{$('#noteT').textContent=notesTxt(song)||'Aucune note. Ajoutez-en via « Gérer » dans la bibliothèque.';$('#noteM').classList.toggle('hide',!+(song.notes&&song.notes.bpm));$('#noteV').classList.remove('hide')};
$('#noteX').onclick=()=>$('#noteV').classList.add('hide');
$('#noteM').onclick=()=>{setBpm(+song.notes.bpm);$('#noteV').classList.add('hide');tog('#met','#mt',true)};

/* métronome */
let MCx=null,mBpm=100,mBeats=4,mVol=.6,mNext=0,mBeat=0,mTimer=null,mQ=[],taps=[];
const dots=()=>{$('#mDots').innerHTML='<i></i>'.repeat(mBeats)};
function setBpm(v){mBpm=clamp(Math.round(v),30,300);$('#mB').textContent=mBpm;$('#mR').value=mBpm}
function mTick(){while(mNext<MCx.currentTime+.12){const acc=mBeat%mBeats===0,o=MCx.createOscillator(),g=MCx.createGain();
    o.frequency.value=acc?1500:1000;g.gain.setValueAtTime(mVol,mNext);g.gain.exponentialRampToValueAtTime(.001,mNext+.06);
    o.connect(g);g.connect(MCx.destination);o.start(mNext);o.stop(mNext+.07);mQ.push([mNext,mBeat%mBeats]);mNext+=60/mBpm;mBeat++}
  while(mQ.length&&mQ[0][0]<=MCx.currentTime){const b=mQ.shift()[1];document.querySelectorAll('#mDots i').forEach((d,i)=>d.classList.toggle('on',i===b))}}
function mStart(){try{MCx=MCx||new (window.AudioContext||window.webkitAudioContext)();MCx.resume()}catch(e){return toast('Métronome indisponible')}
  mBeat=0;mNext=MCx.currentTime+.08;mQ=[];clearInterval(mTimer);mTimer=setInterval(mTick,25);$('#mGo').textContent='■ Stop'}
function mStop(){clearInterval(mTimer);mTimer=null;mQ=[];document.querySelectorAll('#mDots i').forEach(d=>d.classList.remove('on'));$('#mGo').textContent='▶ Démarrer'}
$('#mt').onclick=()=>{if(!tog('#met','#mt'))mStop()};
$('#mGo').onclick=()=>mTimer?mStop():mStart();
$('#mM').onclick=()=>setBpm(mBpm-1);$('#mP').onclick=()=>setBpm(mBpm+1);$('#mR').oninput=e=>setBpm(+e.target.value);
$('#mS').onchange=e=>{mBeats=+e.target.value;dots();mBeat=0};$('#mV').oninput=e=>mVol=+e.target.value;
$('#mT').onclick=()=>{const n=Date.now();taps=taps.filter(x=>n-x<2000);taps.push(n);if(taps.length>1)setBpm(60000/((taps[taps.length-1]-taps[0])/(taps.length-1)))};

/* ---------- Démarrage de l'app ---------- */
(async()=>{
  try{db=await openDB()}catch(e){db=null;toast('Stockage local indisponible : les morceaux ne seront pas conservés',5000)}
  syncSet();applyTheme();$('#sortS').value=S.sort;dots();setBpm(100);refresh();
})();
</script>
</body>
</html>
